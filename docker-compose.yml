# CrewForm application services. Requires a COMPLETE Supabase backend.
# See docs/self-hosting.md for local Supabase or production setup.
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Set the browser-accessible Supabase URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?Set the Supabase public key}
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost:3000}
        VITE_TASK_RUNNER_URL: ${VITE_TASK_RUNNER_URL:-http://localhost:3001}
        VITE_CREWFORM_EDITION: ce
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
  task-runner:
    build:
      context: .
      dockerfile: task-runner/Dockerfile
    restart: unless-stopped
    ports:
      - "${RUNNER_BIND_ADDRESS:-127.0.0.1}:${RUNNER_PORT:-3001}:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      VITE_SUPABASE_URL: ${SUPABASE_INTERNAL_URL:?Set a Supabase URL reachable from Docker}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set the Supabase service-role key}
      API_KEY_ENCRYPTION_KEY: ${API_KEY_ENCRYPTION_KEY:?Set the shared encryption key}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set the shared webhook secret}
      CREWFORM_EDITION: ce
      ALLOW_PRIVATE_PROVIDER_URLS: ${ALLOW_PRIVATE_PROVIDER_URLS:-false}
      TRIGGER_SCHEDULER_ENABLED: ${TRIGGER_SCHEDULER_ENABLED:-true}
      CREWFORM_EXTERNAL_AGENTS_ENABLED: "false"
